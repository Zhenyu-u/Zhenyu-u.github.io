<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../all.css">
    <link rel="stylesheet" href="../variables/base/reset.css">
</head>

<body>
    <section class="section">
        <nav class="nav-item">
            <div class="nav-left">
                <div class="logo-item">
                    <img class="logo" src="../assets/image/Logo.png">
                </div>
                <ul>
                    <li style="list-style-type: none;">商品列表</li>
                    <li style="list-style-type: none;">品牌故事</li>
                </ul>
            </div>
            <div class="nav-right">
                <img class="user-icon" src="../assets/image/Btn wrapper.png" alt="user-icon">
            </div>
        </nav>
    </section>

    <section class="section-center">
        <div class="favorites-container">
            <div class="favorites-item">
                <img src="../assets/image/Check.png" alt="check-icon">
                <div class="title-text">我的收藏</div>
            </div>
            <div class="note-content">
                <div class="note-item">
                    <img src="../assets/image/truck.png" alt="note-icon">
                    <div class="note-text">門市營業時間：週ㄧ至週五 10:00 - 22:00</div>
                </div>
            </div>


            <div class="prod-container">
                <img src="../assets/image/Main image.png" alt="產品">
                <div class="detail">
                    <div class="prod-name">PLATFORM 404 </div>
                    <div class="detail-item">
                        <div class="size-text">尺寸</div>
                        <div class="nb-text">38</div>
                    </div>
                    <div class="detail-item">
                        <div class="size-text">顏色</div>
                        <div class="nb-text">Navy</div>
                    </div>
                    <div class="prod-price">NT$2,600</div>
                </div>
            </div>

            <div class="prod-container">
                <img src="../assets/image/02.png" alt="產品">
                <div class="detail">
                    <div class="prod-name">BOOMLOK</div>
                    <div class="detail-item">
                        <div class="size-text">尺寸</div>
                        <div class="nb-text">38</div>
                    </div>
                    <div class="detail-item">
                        <div class="size-text">顏色</div>
                        <div class="nb-text">White</div>
                    </div>
                    <div class="prod-price">NT$3,200</div>
                </div>
            </div>

            <div class="prod-container">
                <img src="../assets/image/01.png" alt="產品">
                <div class="detail">
                    <div class="prod-name">MELTY KISS</div>
                    <div class="detail-item">
                        <div class="size-text">尺寸</div>
                        <div class="nb-text">38</div>
                    </div>
                    <div class="detail-item">
                        <div class="size-text">顏色</div>
                        <div class="nb-text">Violet</div>
                    </div>
                    <div class="prod-price">NT$4,000</div>
                </div>
            </div>
            <div class="btn-bk">立即預約門市試穿</div>
        </div>
    </section>

    <footer class="footer-box">
        <div class="footer-content">
            <div class="footer-item">
                <div class="logo-item">
                    <img class="logo" src="../assets/image/Logo.png">
                </div>
                <ul>
                    <li style="list-style-type: none;">商品列表</li>
                    <li style="list-style-type: none;">品牌故事</li>
                </ul>
            </div>
            <div class="footer-info">
                <div class="info-text">Copyright ©2025 URBNSTYLE</div>
                <div class="info-text">All Rights Reserved</div>
            </div>
        </div>
    </footer>
</body>

</html>
